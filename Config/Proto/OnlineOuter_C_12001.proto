message ServerTestCmdCategoryInfo
{
	string Id = 1;
	int32 Order = 2;
	string LabelText = 3;
}

message ServerTestCmdEntryInfo
{
	string Id = 1;
	string CategoryId = 2;
	int32 Order = 3;
	string LabelText = 4;
	string CommandTemplate = 5;
	string DescriptionText = 6;
	string UsageText = 7;
	string ExampleText = 8;
}

// ResponseType G2C_GetServerTestCmdCatalog
message C2G_GetServerTestCmdCatalog // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_GetServerTestCmdCatalog // ISessionResponse
{
