syntax = "proto3";
package ET;

// ResponseType G2C_Register
message C2G_Register // ISessionRequest
{
	int32 RpcId = 1;
	string UserName = 2;
	string Password = 3;
}

message G2C_Register // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 AccountId = 4;
}

// ResponseType G2C_Login
message C2G_Login // ISessionRequest
{
	int32 RpcId = 1;
	string UserName = 2;
	string Password = 3;
}

message G2C_Login // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 AccountId = 4;
	int64 PlayerId = 5;
	int64 SessionEpoch = 6;
	bool IsPlayerActorReused = 7;
	bool IsNewAccount = 8;
}

// ResponseType G2C_Logout
message C2G_Logout // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Logout // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

message G2C_SessionReplaced // ISessionMessage
{
	int32 Error = 1;
	string Reason = 2;
}

message RoomMemberInfo
{
	int64 PlayerId = 1;
	string DisplayName = 2;
	bool IsOwner = 3;
	int32 ConnectionState = 4;
	int64 JoinSequence = 5;
}

message OnlineRoomSnapshot
{
	int64 RoomId = 1;
	string RoomCode = 2;
	int64 OwnerPlayerId = 3;
	int64 MembershipRevision = 4;
	repeated RoomMemberInfo Members = 5;
	int32 Purpose = 6;
	int32 Visibility = 7;
	int32 Capacity = 8;
	bool MembershipLocked = 9;
	string ClientVersion = 10;
	string ArcadeConfigFingerprint = 11;
}

// ResponseType G2C_CreateRoom
message C2G_CreateRoom // ISessionRequest
{
	int32 RpcId = 1;
	string OperationId = 2;
	int32 Purpose = 3;
	int32 Visibility = 4;
	string ClientVersion = 5;
	string ArcadeConfigFingerprint = 6;
}

message G2C_CreateRoom // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	bool HasRoom = 4;
	OnlineRoomSnapshot Room = 5;
}

// ResponseType G2C_MatchArcadeRoom
message C2G_MatchArcadeRoom // ISessionRequest
{
	int32 RpcId = 1;
	string OperationId = 2;
	string ClientVersion = 3;
	string ArcadeConfigFingerprint = 4;
}

message G2C_MatchArcadeRoom // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	bool HasRoom = 4;
	OnlineRoomSnapshot Room = 5;
}

// ResponseType G2C_JoinRoom
message C2G_JoinRoom // ISessionRequest
{
	int32 RpcId = 1;
	string OperationId = 2;
	string RoomCode = 3;
	int32 ExpectedPurpose = 4;
	string ClientVersion = 5;
	string ArcadeConfigFingerprint = 6;
}

message G2C_JoinRoom // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	bool HasRoom = 4;
	OnlineRoomSnapshot Room = 5;
}

// ResponseType G2C_LeaveRoom
message C2G_LeaveRoom // ISessionRequest
{
	int32 RpcId = 1;
	string OperationId = 2;
}

message G2C_LeaveRoom // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2C_GetCurrentRoom
message C2G_GetCurrentRoom // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_GetCurrentRoom // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	bool HasRoom = 4;
	OnlineRoomSnapshot Room = 5;
}

message G2C_RoomChanged // ISessionMessage
{
	bool HasRoom = 1;
