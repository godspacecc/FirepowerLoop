// Opcode 12079
message OnlineArcadePowerupInfo
{
	string ProductId = 1;
	float RemainingSeconds = 2;
	int32 Charges = 3;
	float PositionX = 4;
	float PositionZ = 5;
	// 强化最后一次实际发射方向；未开火时为零，仅用于哨塔和战斗鸡表现。
	float ShotDirectionX = 6;
	float ShotDirectionZ = 7;
	// 无人机权威阶段和当前红紫强度；重连只投影当前阶段。
	int32 DronePhase = 8;
	int32 DronePowerTier = 9;
	// 紫级第二架无人机的权威位置与阶段，未激活时HasExtraDrone=false。
	bool HasExtraDrone = 10;
	float ExtraDroneX = 11;
	float ExtraDroneZ = 12;
	int32 ExtraDronePhase = 13;
	float ExtraDroneDirectionX = 14;
	float ExtraDroneDirectionZ = 15;
}

// Opcode 12080
message OnlineArcadeBattlePlayerInfo
{
	int64 PlayerId = 1;
	float PositionX = 2;
	float PositionZ = 3;
	float AimX = 4;
	float AimZ = 5;
	int32 CurrentHealth = 6;
	int32 MaxHealth = 7;
	bool Alive = 8;
	bool Invulnerable = 9;
	float RespawnSeconds = 10;
	string TemporaryWeaponId = 11;
	float TemporaryWeaponSeconds = 12;
	string SupportId = 13;
	float SupportSeconds = 14;
	float DashSeconds = 15;
	repeated OnlineArcadePowerupInfo Powerups = 16;
	// 本场成功攻击序列，客户端仅用于动作去重。
	int32 FireSequence = 17;
	bool InTreasureRoom = 18;
	int32 VestSlots = 19;
	int32 Plates = 20;
	bool HasStorm = 21;
	int32 StormCharge = 22;
	float StormSeconds = 23;
	repeated OnlineSlayerMartSupportInfo SlayerMartSupports = 24;
	float DownedSeconds = 25;
	float RescueRate = 26;
	// 本次冲刺锁定方向，客户端预测使用同一权威向量。
	float DashDirectionX = 27;
	float DashDirectionZ = 28;
	// 当前牛撞的权威剩余量；重连直接恢复飞行或落地僵直，不重播。
	float HerdImpactRemaining = 29;
	float HerdImpactDirectionX = 30;
	float HerdImpactDirectionZ = 31;
	// 实际掉血的牛撞反馈，包含致死；序列只增，位置在死亡/复活变更前记录。
	int64 HerdContactSequence = 32;
	float HerdContactX = 33;
	float HerdContactZ = 34;
	double HerdContactElapsedSeconds = 35;
}

// Opcode 12081
message OnlineArcadeEnemyInfo
{
	int64 RuntimeId = 1;
	string EnemyConfigId = 2;
	float PositionX = 3;
	float PositionZ = 4;
	int32 CurrentHealth = 5;
	int32 MaxHealth = 6;
	int64 TargetPlayerId = 7;
	int32 WaveNumber = 8;
	string BossId = 9;
	int32 BossPhase = 10;
	float BossPhaseSeconds = 11;
	// 本轮独立护甲的剩余耐久，不计入生命。
	int32 ArmorHealth = 12;
	int32 SpecialKind = 13;
	int32 ContentBossKind = 14;
	bool ContentWarning = 15;
	// 最近一次有效喷火命中的表现剩余时间，不产生持续伤害。
	float FlameHitRemainingSeconds = 16;
	// 存活敌人被牛撞后的当前飞行／落地状态。
	float HerdImpactRemaining = 17;
	float HerdImpactDirectionX = 18;
	float HerdImpactDirectionZ = 19;
	// 墓穴、乌鸦和蓝影只同步当前权威阶段，不在客户端重播计时。
	int32 StageEnemyPhase = 20;
	float StageEnemyAge = 21;
	float StageEnemyOriginX = 22;
	float StageEnemyOriginZ = 23;
	int32 StageEnemyRevives = 24;
	// 已完成的真实近战挥击序列；首快照只建立基线，重连不重播。
	int32 AttackSequence = 25;
	float MeleeWindupSeconds = 26;
	float MeleeWindupRemaining = 27;
	float MeleeRecoveryRemaining = 28;
	// 码头海中进场：只复制当前权威进度，完成身份保留到实体结束。
	bool DockSeaEntryStarted = 29;
	float DockSeaEntryAge = 30;
	float DockSeaEntryLane = 31;
}

// Opcode 12082
message OnlineArcadeProjectileInfo
{
	int64 RuntimeId = 1;
	int64 OwnerPlayerId = 2;
	float PositionX = 3;
	float PositionZ = 4;
	float VelocityX = 5;
	float VelocityZ = 6;
	// 发射时的玩家武器身份；支援和敌方弹丸为空。
	string SourceWeaponId = 7;
	// 弹丸生成时固定的头骨强化层级，0原色、1红色、2紫色。
	int32 WeaponPowerLevel = 8;
	// 发射时固定的宽贯穿半径与集束子弹标记，只投影实际生成的能力。
	float EvolutionHitRadius = 9;
	bool EvolutionClusterChild = 10;
	// 剩余飞行寿命仅用于已采用榴弹弧线的相位，客户端不裁决引爆。
	float RemainingSeconds = 11;
}

// Opcode 12083
message OnlineArcadeDropInfo
{
	int64 RuntimeId = 1;
	string DropConfigId = 2;
	float PositionX = 3;
	float PositionZ = 4;
	// 只在成功补给记录中使用；普通可见掉落为零。
	int64 CollectedByPlayerId = 5;
	// 上限截断后的实际补充次数，不是配置奖励量。
	int32 AddedAmount = 6;
	// 已成功应用的积分与金币变化，彼此独立；零值不产生提示。
	int64 ScoreAdded = 7;
	int32 GoldAdded = 8;
	// 固定点武器空投，普通击杀掉落不使用；剩余时间涵盖下降和自动开箱。
	bool WeaponAirdrop = 10;
	float DeliveryRemainingSeconds = 11;
	// 普通可见掉落的剩余寿命；成功领取收据不使用此值。
	float RemainingSeconds = 9;
}

// Opcode 12084
message OnlineArcadeBattleInfo
{
	int32 ArenaNumber = 1;
	int32 WaveNumber = 2;
	int32 WaveCount = 3;
	int32 SpawnedInWave = 4;
	int32 TotalInWave = 5;
	int32 DifficultyPlayerCount = 6;
	int64 BattleRevision = 7;
	int64 ServerTime = 8;
	repeated OnlineArcadeBattlePlayerInfo Players = 9;
	repeated OnlineArcadeEnemyInfo Enemies = 10;
	repeated OnlineArcadeProjectileInfo Projectiles = 11;
	repeated OnlineArcadeDropInfo Drops = 12;
	bool IsChallenge = 13;
	string ChallengeId = 14;
	float ChallengeSeconds = 15;
	// 仅在活动战斗推进的机关累计秒数；客户端显示，不裁决接触伤害。
	float HazardElapsedSeconds = 16;
	// 场地配置身份与主线完成序号分离，路线跳转不改变难度进度。
	int32 ArenaConfigNumber = 17;
	bool IsFinalBoss = 18;
	bool AwaitingExit = 19;
	// 本场共享房间投影；稳定物品 ID 不携带客户端可改的奖励价值。
	string TreasureRoomId = 20;
	bool TreasureDiscovered = 21;
	bool TreasureOpen = 22;
	bool TreasureExpired = 23;
	float TreasureSeconds = 24;
	repeated int32 TreasureRewardIds = 25;
	// 完整剩余箱列表，破坏后移除；客户端不得从此列表发奖。
	repeated int32 CrateIds = 26;
	// 本场成功补给记录；客户端按 RuntimeId 去重，仅反馈、不发奖。
	repeated OnlineArcadeDropInfo SupplyPickups = 27;
	// 宝藏房预置奖励剩余寿命，与房间出口时钟独立。
	float TreasureRewardSeconds = 28;
	string RoundLayoutId = 29;
	int32 RoundLayoutVersion = 30;
	int32 RoundGeneration = 31;
	bool RoundLoading = 32;
	string RoundLoadError = 33;
	float ContentElapsed = 34;
	repeated OnlineArcadeContentAreaInfo ContentAreas = 35;
 bool RoundBossEncounter = 36;
 bool RoundBossDefeated = 37;
	int32 SlayerMartRulesVersion = 38;
	bool SlayerMartActive = 39;
	int32 SlayerMartVisit = 40;
	int32 SlayerMartGeneration = 41;
	bool SlayerMartReady = 42;
	bool SlayerMartClosing = 43;
	float SlayerMartSeconds = 44;
	repeated OnlineSlayerMartMemberInfo SlayerMartMembers = 45;
	repeated int32 SlayerMartCashBoxIds = 46;
	int64 SlayerMartRevision = 47;
	bool SlayerMartPrepared = 48;
    // 独立Slayer挑战公共权威状态；现金为每位原始成员同额收集额，不公开个人购物余额。
    int32 SlayerPhase = 49;
    int32 SlayerDowns = 50;
    int32 SlayerDownLimit = 51;
    int64 SlayerCashCollected = 52;
    repeated int64 SlayerExitVotes = 53;
    repeated int64 SlayerEnterReady = 54;
    repeated int64 SlayerSkipReady = 55;
    int32 SlayerOutcome = 56;
	// 成功炸弹的有界表现记录；只读，不改变伤害判定。
	repeated OnlineArcadeBombBlastInfo BombBlasts = 57;
	// 只读死亡表现事实；客户端不据此裁决伤害或同步骨骼。
	repeated OnlineArcadeEnemyDeathInfo EnemyDeaths = 58;
    // 每轮金币现场只读投影；领取由服务器裁决。
    OnlineArcadeRoundRewardInfo RoundReward = 59;
    float StagePortalSeconds = 60;
    float StagePortalX = 61;
    float StagePortalZ = 62;
    // 地图独占牛群姿态；仅权威端推进与结算伤害。
    repeated OnlineArcadeHerdInfo Herds = 63;
    // 已裁决电击的有界记录；客户端不能据此再扣血。
    repeated OnlineArcadeElectricHitInfo ElectricHits = 64;
 // 当前轮真实武器碰撞反馈，客户端不从弹丸消失推断命中。
 repeated OnlineArcadeWeaponFeedbackInfo WeaponFeedback = 65;
}

