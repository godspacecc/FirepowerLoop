{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated PublicRoomSummary Rooms = 4;
	int64 NextCursorRoomId = 5;
	bool HasMore = 6;
}

message OnlineArcadeShopOfferInfo
{
	string OfferId = 1;
	string ShopItemId = 2;
	string ProductId = 3;
	int32 ProductType = 4;
	int32 Price = 5;
	int32 Amount = 6;
	int32 PurchaseCount = 7;
	int32 MaxPurchases = 8;
}

message OnlineArcadeOwnedAmountInfo
{
	string Id = 1;
	int32 Amount = 2;
}

message OnlineArcadeEquipmentInfo
{
	string SlotId = 1;
	string ProductId = 2;
}

message OnlineArcadePowerupInfo
{
	string ProductId = 1;
	float RemainingSeconds = 2;
	int32 Charges = 3;
	float PositionX = 4;
	float PositionZ = 5;
	// 强化最后一次实际发射方向；未开火时为零，仅用于哨塔和战斗鸡表现。
	float ShotDirectionX = 6;
	float ShotDirectionZ = 7;
}

message OnlineArcadeBattlePlayerInfo
{
	int64 PlayerId = 1;
	float PositionX = 2;
	float PositionZ = 3;
	float AimX = 4;
	float AimZ = 5;
	int32 CurrentHealth = 6;
	int32 MaxHealth = 7;
	bool Alive = 8;
	bool Invulnerable = 9;
	float RespawnSeconds = 10;
	string TemporaryWeaponId = 11;
	float TemporaryWeaponSeconds = 12;
	string SupportId = 13;
	float SupportSeconds = 14;
	float DashSeconds = 15;
	repeated OnlineArcadePowerupInfo Powerups = 16;
	// 本场成功攻击序列，客户端仅用于动作去重。
	int32 FireSequence = 17;
	bool InTreasureRoom = 18;
}

message OnlineArcadeEnemyInfo
{
	int64 RuntimeId = 1;
	string EnemyConfigId = 2;
	float PositionX = 3;
	float PositionZ = 4;
	int32 CurrentHealth = 5;
	int32 MaxHealth = 6;
	int64 TargetPlayerId = 7;
	int32 WaveNumber = 8;
	string BossId = 9;
	int32 BossPhase = 10;
	float BossPhaseSeconds = 11;
	// 本轮独立护甲的剩余耐久，不计入生命。
	int32 ArmorHealth = 12;
}

message OnlineArcadeProjectileInfo
{
	int64 RuntimeId = 1;
	int64 OwnerPlayerId = 2;
	float PositionX = 3;
	float PositionZ = 4;
	float VelocityX = 5;
	float VelocityZ = 6;
}

message OnlineArcadeDropInfo
{
	int64 RuntimeId = 1;
	string DropConfigId = 2;
	float PositionX = 3;
	float PositionZ = 4;
	// 只在成功补给记录中使用；普通可见掉落为零。
	int64 CollectedByPlayerId = 5;
	// 上限截断后的实际补充次数，不是配置奖励量。
	int32 AddedAmount = 6;
}

message OnlineArcadeBattleInfo
{
	int32 ArenaNumber = 1;
	int32 WaveNumber = 2;
	int32 WaveCount = 3;
	int32 SpawnedInWave = 4;
	int32 TotalInWave = 5;
	int32 DifficultyPlayerCount = 6;
	int64 BattleRevision = 7;
	int64 ServerTime = 8;
	repeated OnlineArcadeBattlePlayerInfo Players = 9;
	repeated OnlineArcadeEnemyInfo Enemies = 10;
	repeated OnlineArcadeProjectileInfo Projectiles = 11;
	repeated OnlineArcadeDropInfo Drops = 12;
	bool IsChallenge = 13;
	string ChallengeId = 14;
	float ChallengeSeconds = 15;
	// 仅在活动战斗推进的机关累计秒数；客户端显示，不裁决接触伤害。
	float HazardElapsedSeconds = 16;
	// 场地配置身份与主线完成序号分离，路线跳转不改变难度进度。
	int32 ArenaConfigNumber = 17;
	bool IsFinalBoss = 18;
	bool AwaitingExit = 19;
	// 本场共享房间投影；稳定物品 ID 不携带客户端可改的奖励价值。
	string TreasureRoomId = 20;
	bool TreasureDiscovered = 21;
	bool TreasureOpen = 22;
	bool TreasureExpired = 23;
	float TreasureSeconds = 24;
	repeated int32 TreasureRewardIds = 25;
	// 完整剩余箱列表，破坏后移除；客户端不得从此列表发奖。
	repeated int32 CrateIds = 26;
	// 本场成功补给记录；客户端按 RuntimeId 去重，仅反馈、不发奖。
	repeated OnlineArcadeDropInfo SupplyPickups = 27;
}

message OnlineArcadePlayerInfo
{
	int64 PlayerId = 1;
	string DisplayName = 2;
	int32 Lives = 3;
	int32 RunGold = 4;
	int32 Bombs = 5;
	int32 Dashes = 6;
	string WeaponId = 7;
	bool Ready = 8;
	repeated OnlineArcadeShopOfferInfo ShopOffers = 9;
	repeated OnlineArcadeOwnedAmountInfo UpgradeStacks = 10;
	repeated OnlineArcadeOwnedAmountInfo Consumables = 11;
	repeated OnlineArcadeEquipmentInfo Equipment = 12;
	repeated OnlineArcadeRewardAmountInfo PendingRewards = 13;
	bool SettlementConfirmed = 14;
	bool AbandonConfirmed = 15;
	int32 SettlementState = 16;
	bool ChallengeReady = 17;
	int64 Score = 18;
	int32 ScoreMultiplier = 19;
	int32 MultiplierProgress = 20;
}

message OnlineArcadeRewardAmountInfo
{
	string RewardId = 1;
	int64 Amount = 2;
}

message OnlineArcadeConnectionInfo
{
	int64 PlayerId = 1;
	bool Connected = 2;
	int64 DisconnectedAtServerTime = 3;
	int64 ArenaReconnectDeadlineServerTime = 4;
	int64 SoloEndAvailableAtServerTime = 5;
}

message OnlineArcadeRunSnapshot
{
	int64 RunId = 1;
	int64 RoomId = 2;
	int64 Revision = 3;
	int32 Phase = 4;
	int32 CompletedArena = 5;
	int32 NextArena = 6;
	string ConfigFingerprint = 7;
	repeated OnlineArcadePlayerInfo Players = 8;
	OnlineArcadeBattleInfo Battle = 9;
