message PublicRoomSummary
{
	string RoomCode = 1;
	string OwnerDisplayName = 2;
	int32 MemberCount = 3;
	int32 Capacity = 4;
}

// ResponseType G2C_GetPublicRoomList
message C2G_GetPublicRoomList // ISessionRequest
{
	int32 RpcId = 1;
	int64 CursorRoomId = 2;
}

