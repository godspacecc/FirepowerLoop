	bool Ready = 8;
	repeated OnlineArcadeOwnedAmountInfo UpgradeStacks = 10;
	repeated OnlineArcadeOwnedAmountInfo Consumables = 11;
	repeated OnlineArcadeEquipmentInfo Equipment = 12;
	bool SettlementConfirmed = 14;
	bool AbandonConfirmed = 15;
	int32 SettlementState = 16;
	bool ChallengeReady = 17;
	int64 Score = 18;
	int32 ScoreMultiplier = 19;
	int32 MultiplierProgress = 20;
}



