}

message RoomChatMessageInfo
{
	string ChatMessageId = 1;
	int64 ChatSequence = 2;
	int64 SenderPlayerId = 3;
	string SenderDisplayName = 4;
	int64 ServerTime = 5;
	string Content = 6;
}

// ResponseType G2C_SendRoomChat
message C2G_SendRoomChat // ISessionRequest
{
	int32 RpcId = 1;
	string ClientMessageId = 2;
	string Content = 3;
}

message G2C_SendRoomChat // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 RoomId = 4;
	bool Accepted = 5;
