syntax = "proto3";
package ET;

// Opcode 12002
// ResponseType G2C_Register
message C2G_Register // ISessionRequest
{
	int32 RpcId = 1;
	string UserName = 2;
	string Password = 3;
}

// Opcode 12003
message G2C_Register // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 AccountId = 4;
}

// Opcode 12004
// ResponseType G2C_Login
message C2G_Login // ISessionRequest
{
	int32 RpcId = 1;
	string UserName = 2;
	string Password = 3;
}

// Opcode 12005
message G2C_Login // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 AccountId = 4;
