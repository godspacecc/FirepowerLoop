}

message WorldPlayerInfo
{
	int64 PlayerId = 1;
	int64 UnitId = 2;
	string DisplayName = 3;
	int64 WorldId = 4;
	string MapId = 5;
	string PlayerConfigId = 6;
	float PositionX = 7;
	float PositionY = 8;
	float PositionZ = 9;
	float YawDegrees = 10;
	int32 ConnectionState = 11;
	int64 StateRevision = 12;
	int32 CurrentHP = 13;
	int32 MaxHP = 14;
	bool IsDead = 15;
	int64 RespawnAtServerTime = 16;
	int64 LastAcceptedAttackSequence = 17;
	int64 LifecycleRevision = 18;
	int32 TorsoItemId = 19;
	int32 LegsItemId = 20;
	int32 HeadItemId = 21;
	int32 HandsItemId = 22;
	int32 FeetItemId = 23;
	int32 BackItemId = 24;
	int32 ArmorItemId = 25;
}

message WorldEnemyInfo
{
	int64 UnitId = 1;
	int64 WorldId = 2;
	string MapId = 3;
	string EnemyConfigId = 4;
	float SpawnPositionX = 5;
	float SpawnPositionY = 6;
	float SpawnPositionZ = 7;
	float SpawnYawDegrees = 8;
	float PositionX = 9;
	float PositionY = 10;
	float PositionZ = 11;
	float YawDegrees = 12;
	int64 TargetUnitId = 13;
	int32 CurrentHP = 14;
	int32 MaxHP = 15;
	bool IsDead = 16;
	int64 RespawnAtServerTime = 17;
	int64 StateRevision = 18;
	int64 LifecycleRevision = 19;
}

message WorldEnemyTransformInfo
{
	int64 UnitId = 1;
	float PositionX = 2;
	float PositionY = 3;
	float PositionZ = 4;
	float YawDegrees = 5;
	int64 StateRevision = 6;
	int64 LifecycleRevision = 7;
}

message WorldEnemyNavigationReport
{
	int64 UnitId = 1;
	int64 LifecycleRevision = 2;
	float PositionX = 3;
	float PositionY = 4;
	float PositionZ = 5;
	float YawDegrees = 6;
}

message OnlineItemSlotInfo
{
	int32 SlotIndex = 1;
	int32 ItemId = 2;
	int32 Amount = 3;
	int32 LoadedAmmo = 4;
}

message OnlineEquipmentInfo
{
	int32 MeleeWeaponItemId = 1;
	int32 RangedWeaponItemId = 2;
	int32 ActiveSlot = 3;
	int32 RangedLoadedAmmo = 4;
	int32 SchemaVersion = 5;
	int32 SourceSlotIndex = 6;
	int32 ItemId = 7;
}

message OnlineInventoryInfo
{
	int32 Capacity = 1;
	repeated OnlineItemSlotInfo Slots = 2;
	OnlineEquipmentInfo Equipment = 3;
	int64 Revision = 4;
	int32 MigrationExtraCapacity = 5;
	int32 TorsoItemId = 6;
	int32 LegsItemId = 7;
	int32 HeadItemId = 8;
	int32 HandsItemId = 9;
	int32 FeetItemId = 10;
	int32 BackItemId = 11;
	int32 ArmorItemId = 12;
}

message WorldCorpseInfo
{
	int64 CorpseId = 1;
	int32 SourceKind = 2;
	int64 SourceUnitId = 3;
	int64 SourcePlayerId = 4;
	string SourceConfigId = 5;
	int64 WorldId = 6;
	string MapId = 7;
	float PositionX = 8;
	float PositionY = 9;
	float PositionZ = 10;
	float YawDegrees = 11;
	int64 ExpiresAtServerTime = 12;
	bool HasContents = 13;
	int64 StateRevision = 14;
}

message WorldCorpseContentsInfo
{
	WorldCorpseInfo Corpse = 1;
	int32 Capacity = 2;
	repeated OnlineItemSlotInfo Slots = 3;
}

message WorldTemporaryBuildingInfo
{
	int32 RuntimeId = 1;
	string ConfigId = 2;
	int64 WorldId = 3;
	string MapId = 4;
	float PositionX = 5;
	float PositionY = 6;
	float PositionZ = 7;
	float YawDegrees = 8;
	int32 LoadedAmmo = 9;
	int64 NextShootAtServerTime = 10;
	int64 StateRevision = 11;
}

message OnlineWorldSnapshot
{
	int64 WorldId = 1;
	string MapId = 2;
	int64 WorldRevision = 3;
	int64 SelfUnitId = 4;
	repeated WorldPlayerInfo Players = 5;
	repeated WorldEnemyInfo Enemies = 6;
	int64 NavigationExecutorUnitId = 7;
	int64 NavigationLeaseRevision = 8;
	int64 ServerTime = 9;
	OnlineInventoryInfo SelfInventory = 10;
	repeated WorldCorpseInfo Corpses = 11;
	repeated WorldTemporaryBuildingInfo TemporaryBuildings = 12;
	repeated WorldProjectileInfo Projectiles = 13;
	string CollisionContentHash = 14;
}




