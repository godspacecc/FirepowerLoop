<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FirepowerLoop · 空投物品积分商店概念预览 v2</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#f0f2f3;background:#0c1118}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#26313c 0,transparent 65%),#0c1118}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.38}main{max-width:1100px;margin:auto;padding:32px 38px}.brand{display:flex;justify-content:space-between;align-items:center;color:#8494a5;font-size:12px;letter-spacing:2px}.badge{border:1px solid #40505d;border-radius:20px;padding:7px 13px;letter-spacing:0;color:#b7c4cf}.heading{display:flex;align-items:end;justify-content:space-between;margin:32px 0 27px}.kicker{color:#f5c66a;font-size:13px;letter-spacing:3px}h1{font-size:38px;letter-spacing:3px;margin:10px 0 9px}.intro{font-size:14px;color:#a5b2be;line-height:1.8;margin:0}.wallet{text-align:right}.wallet label{font-size:12px;color:#a5b2be}.score{font-size:36px;font-weight:700;color:#f5c66a;margin-top:5px;font-variant-numeric:tabular-nums}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{position:relative;min-height:327px;padding:23px;border:1px solid #344451;border-top:3px solid var(--accent);border-radius:12px;background:linear-gradient(155deg,#202d38,#141e27);display:flex;flex-direction:column}.type{display:flex;justify-content:space-between;font-size:12px;color:var(--accent);letter-spacing:2px}.icon{margin:24px 0 15px;height:58px;color:var(--accent)}svg{height:58px;width:58px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}.card h2{font-size:23px;margin:0 0 11px}.desc{font-size:14px;color:#b8c5ce;line-height:1.85;min-height:52px;margin:0 0 23px}.buy{margin-top:auto;width:100%;padding:13px 10px;background:var(--accent);color:#111923;font-weight:bold;border:0;border-radius:6px;display:flex;justify-content:space-between;gap:10px}.buy:hover:not(:disabled){filter:brightness(1.1)}.toolbar{display:flex;gap:14px;justify-content:center;margin-top:25px}.refresh,.skip{border-radius:7px;padding:13px 29px;font-size:15px}.refresh{border:1px solid #b99350;background:#302a20;color:#f5c66a}.skip{border:1px solid #465462;color:#c6cfd6;background:#1a242e}.rule{text-align:center;font-size:12px;color:#9aabb9;margin:19px 0 0;line-height:1.8}.message{min-height:27px;text-align:center;font-size:14px;color:#f5c66a;margin:14px 0 0}.demo{margin-top:26px;border-top:1px solid #293541;padding-top:18px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7f92a1;gap:20px}.demo button{background:none;border:0;color:#a8b8c6;text-decoration:underline;font-size:12px;padding:6px}.result{border:1px solid #72613e;border-radius:12px;background:#20271f;text-align:center;padding:62px 20px;grid-column:1/-1;min-height:327px}.result h2{font-size:28px;color:#f5c66a}.result p{color:#b8c5ce;line-height:1.8}.all-items{margin-top:20px;color:#8e9eac;font-size:12px;line-height:1.9}.all-items summary{cursor:pointer;color:#b9c6cf}.all-items ul{padding-left:22px}button:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:4px}@media(max-width:760px){main{padding:24px 20px}.heading{align-items:start;gap:16px}h1{font-size:29px}.score{font-size:28px}.cards{grid-template-columns:1fr}.card{min-height:290px}.demo{flex-direction:column;align-items:start}.brand{letter-spacing:1px}.toolbar{flex-wrap:wrap}}
</style>
<main>
 <div class="brand"><span>FIREPOWERLOOP / FIELD SHOP</span><span class="badge">空投商品预览 v2 · 非游戏实拍</span></div>
 <header class="heading"><div><div class="kicker">海岛 · 整关完成</div><h1>下一关，怎么打？</h1><p class="intro">三件商品，最多购买一件。<br>也可以保留积分，直接出发。</p></div><div class="wallet"><label>当前积分</label><div class="score" id="score"></div></div></header>
 <section class="cards" id="cards" aria-label="三选一商品"></section>
 <div class="toolbar"><button class="refresh" id="refresh">刷新商品 · 500 积分</button><button class="skip" id="skip">跳过，保留积分 →</button></div>
 <p class="rule">仅出售现有空投物品，下一关开始时领取，沿用原有持续时间。<br>购买与刷新都会扣除积分，推迟下一次加命。刷新每次固定 500 积分。</p>
 <p class="message" id="message" role="status" aria-live="polite"></p>
 <footer class="demo"><span>临时交互稿 · 商品范围已限定为现有空投，价格与具体界面待采用</span><div><button id="low">体验积分不足</button><button id="reset">重置预览</button></div></footer>
 <details class="all-items"><summary>查看现有空投商品池（全程共 8 项）</summary><ul id="pool"></ul><p>本页示例即将进入第2关，只从该关已能空投的4项中选择。同屏不重复，刷新至少更换一项。购买后的同枪强化与支援规则沿用空投领取。</p></details>
</main>
<script>
// 临时界面预览状态，仅演示已确认的购物交互，不接入游戏运行时。
const icons={gun:'<path d="M5 22h42v12H5zM47 26h10M13 34l-5 15h10l7-15M29 34v9h8v-9M15 17h18v5M9 27h12"/>',drone:'<circle cx="29" cy="29" r="10"/><circle cx="9" cy="9" r="6"/><circle cx="49" cy="9" r="6"/><circle cx="9" cy="49" r="6"/><circle cx="49" cy="49" r="6"/><path d="m14 14 8 8m14 14 8 8m-30 0 8-8m14-14 8-8M24 29h10M29 24v10"/>'};
const items=[
{id:'rapid',dropId:'arcade.drop.weapon.rapid',icon:'gun',name:'速射武器',type:'空投武器 · 25秒',desc:'下一关领取现有速射武器。<br>同枪领取沿用原有升档规则。',minArena:2,price:3000,color:'#efbb66',detail:'1件，基础持续25秒，第2关起空投 · 建议3000积分'},
{id:'flamethrower',dropId:'arcade.drop.weapon.flamethrower',icon:'gun',name:'喷火器',type:'空投武器 · 20秒',desc:'下一关领取现有喷火器。<br>效果与空投箱领取一致。',minArena:1,price:3000,color:'#90c7b2',detail:'1件，基础持续20秒，第1关起空投 · 建议3000积分'},
{id:'drone',dropId:'arcade.drop.support.drone',icon:'drone',name:'支援无人机',type:'空投支援 · 25秒',desc:'下一关领取现有支援无人机。<br>沿用原有强化与自毁规则。',minArena:1,price:4000,color:'#a5b7ed',detail:'1份，基础持续25秒，第1关起空投 · 建议4000积分'},
{id:'spread',dropId:'arcade.drop.weapon.spread',icon:'gun',name:'散射武器',type:'空投武器 · 20秒',desc:'下一关领取现有散射武器。<br>效果与空投箱领取一致。',minArena:2,price:3000,color:'#efbb66',detail:'1件，基础持续20秒，第2关起空投 · 建议3000积分'},
{id:'piercing',dropId:'arcade.drop.weapon.piercing',icon:'gun',name:'穿透射线',type:'空投武器 · 18秒',desc:'下一关领取现有穿透射线。<br>效果与空投箱领取一致。',minArena:6,price:4000,color:'#90c7b2',detail:'1件，基础持续18秒，第6关起空投 · 建议4000积分'},
{id:'rocket',dropId:'arcade.drop.weapon.rocket',icon:'gun',name:'火箭发射器',type:'空投武器 · 16秒',desc:'下一关领取现有火箭发射器。<br>效果与空投箱领取一致。',minArena:8,price:5000,color:'#d9a1a0',detail:'1件，基础持续16秒，第8关起空投 · 建议5000积分'},
{id:'grenade',dropId:'arcade.drop.weapon.grenade',icon:'gun',name:'榴弹发射器',type:'空投武器 · 16秒',desc:'下一关领取现有榴弹发射器。<br>效果与空投箱领取一致。',minArena:10,price:5000,color:'#efbb66',detail:'1件，基础持续16秒，第10关起空投 · 建议5000积分'},
{id:'raygun',dropId:'arcade.drop.weapon.raygun',icon:'gun',name:'镭射枪',type:'空投武器 · 14秒',desc:'下一关领取现有镭射枪。<br>效果与空投箱领取一致。',minArena:12,price:6000,color:'#a5b7ed',detail:'1件，基础持续14秒，第12关起空投 · 建议6000积分'}];
let score=12500,offers=[0,1,2],refreshes=0,finished=false;
const nextArena=2,candidates=items.map((item,index)=>item.minArena<=nextArena?index:-1).filter(index=>index>=0);
const el=id=>document.getElementById(id),money=n=>n.toLocaleString('en-US');
function render(){el('score').textContent=money(score);el('refresh').disabled=finished||score<500||!candidates.some(index=>!offers.includes(index));el('skip').disabled=finished;if(finished)return;el('cards').innerHTML=offers.map((index,slot)=>{const item=items[index],poor=score<item.price;return `<article class="card" style="--accent:${item.color}"><div class="type"><span>${item.type}</span><span>0${slot+1}</span></div><div class="icon"><svg viewBox="0 0 60 60" aria-hidden="true">${icons[item.icon]}</svg></div><h2>${item.name}</h2><p class="desc">${item.desc}</p><button class="buy" data-slot="${slot}" ${poor?'disabled':''}><span>${poor?'积分不足':'购买'}</span><span>${money(item.price)} 积分</span></button></article>`}).join('');el('cards').querySelectorAll('button').forEach(button=>button.onclick=()=>buy(Number(button.dataset.slot)));}
function end(title,description){finished=true;render();el('cards').innerHTML=`<div class="result"><div class="kicker">本次商店已结束</div><h2>${title}</h2><p>${description}<br>正式游戏将在双方准备完成后继续下一关。</p></div>`;}
function buy(slot){if(finished)return;const item=items[offers[slot]];if(score<item.price)return;score-=item.price;end(`已购买 · ${item.name}`,`消耗 ${money(item.price)} 积分，剩余 ${money(score)} 积分。`);el('message').textContent='本次已购买一项，不能继续购买或刷新。';}
el('refresh').onclick=()=>{if(finished||score<500)return;const unseen=candidates.filter(index=>!offers.includes(index));if(!unseen.length)return;score-=500;refreshes++;const retained=offers.slice(refreshes%offers.length).concat(offers.slice(0,refreshes%offers.length));offers=unseen.concat(retained).slice(0,3);render();el('message').textContent=`已刷新 ${refreshes} 次 · 本次消耗 500 积分 · 未购买任何商品`;};
el('skip').onclick=()=>{if(finished)return;end('保留积分，继续出发',`跳过不扣分，当前保留 ${money(score)} 积分。`);el('message').textContent='已跳过本次商店。';};
function reset(value){score=value;offers=[0,1,2];refreshes=0;finished=false;el('message').textContent='';render();}
el('reset').onclick=()=>reset(12500);el('low').onclick=()=>reset(400);el('pool').innerHTML=items.map(item=>`<li>${item.name}：${item.detail}</li>`).join('');render();
</script>
</html>
