<svg xmlns="http://www.w3.org/2000/svg" width="860" height="565" viewBox="0 0 860 565" role="img" aria-labelledby="title desc">
  <title id="title">和家村三处已确认湖泊的局部区域草图</title>
  <desc id="desc">以用户圈出的清晰高德卫星局部图为相对位置参考，三个红框内的黑色水面由用户确认是湖泊。背景只区分左侧田地开阔地、右侧植被和中下部田块纹理；不把其他视野中的坝路强行移入此局部图。此图不是完整新场景边界，也不是测绘岸线。</desc>
  <defs>
    <clipPath id="frame"><rect x="34" y="68" width="437" height="461"/></clipPath>
    <pattern id="fields" width="31" height="27" patternUnits="userSpaceOnUse"><path d="M0 14 Q15 2 31 12 M2 26 Q16 18 31 25" fill="none" stroke="#877b59" stroke-opacity=".35" stroke-width="1.5"/></pattern>
  </defs>
  <rect width="860" height="565" fill="#f8f7f1"/>
  <text x="34" y="39" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#20362b">三处湖泊｜清晰影像局部草图</text>
  <g clip-path="url(#frame)" transform="translate(34 68)">
    <rect width="437" height="461" fill="#b9ae8d"/>
    <path d="M202 0 H437 V461 H300 C295 406 257 350 252 292 C239 241 244 204 229 156 C215 111 205 61 202 0 Z" fill="#638063"/>
    <path d="M0 92 C38 95 72 139 95 189 C120 234 160 258 195 277 C229 300 256 365 281 461 H0 Z" fill="#b9aa81"/>
    <path d="M0 92 C38 95 72 139 95 189 C120 234 160 258 195 277 C229 300 256 365 281 461 H0 Z" fill="url(#fields)"/>
    <path d="M205 218 C251 238 276 276 272 326 C265 375 305 421 322 461 H168 C154 413 144 367 155 329 C166 289 185 246 205 218 Z" fill="#a99f77"/>
    <path d="M205 218 C251 238 276 276 272 326 C265 375 305 421 322 461 H168 C154 413 144 367 155 329 C166 289 185 246 205 218 Z" fill="url(#fields)"/>

    <!-- 三个框沿用用户清晰局部图的位置；深色形状仅表达湖体，不主张岸线精度。 -->
    <path d="M251 54 C265 45 281 48 294 41 C308 35 321 40 340 35 L349 57 C334 62 330 83 317 95 C299 101 285 92 269 91 C253 89 247 74 251 54 Z" fill="#173e51" stroke="#b8d6dc" stroke-width="2"/>
    <rect x="239" y="24" width="111" height="89" fill="none" stroke="#bd443c" stroke-width="2.5" stroke-dasharray="8 5"/>
    <path d="M159 270 C174 270 185 276 196 289 C207 301 213 314 208 325 C202 338 192 346 180 344 C168 337 160 320 156 305 C151 289 151 278 159 270 Z" fill="#173e51" stroke="#b8d6dc" stroke-width="2"/>
    <rect x="133" y="259" width="119" height="98" fill="none" stroke="#bd443c" stroke-width="2.5" stroke-dasharray="8 5"/>
    <path d="M53 300 C65 295 84 295 98 301 C104 308 92 315 75 316 C60 316 51 311 53 300 Z" fill="#173e51" stroke="#b8d6dc" stroke-width="2"/>
    <rect x="38" y="280" width="72" height="54" fill="none" stroke="#bd443c" stroke-width="2.5" stroke-dasharray="8 5"/>

  </g>
  <rect x="34" y="68" width="437" height="461" fill="none" stroke="#314838" stroke-width="2"/>
  <g font-family="Microsoft YaHei, sans-serif" fill="#27392e">
    <text x="515" y="109" font-size="20" font-weight="700">已确认</text>
    <text x="515" y="150" font-size="16">1 上方湖泊</text>
    <text x="515" y="181" font-size="16">2 中间偏左湖泊</text>
    <text x="515" y="212" font-size="16">3 左侧小湖泊</text>
    <text x="515" y="262" font-size="16">未圈深色斑块不自动定为水</text>
    <text x="515" y="315" font-size="20" font-weight="700">尚未定稿</text>
    <text x="515" y="353" font-size="15">岸线、道路宽度、地形坡度</text>
    <text x="515" y="382" font-size="15">和完整新场景边界均未测绘。</text>
    <text x="515" y="435" font-size="15">背景色只是粗分区；</text>
    <text x="515" y="464" font-size="15">不绘制或分类建筑。</text>
  </g>
  <text x="34" y="550" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#677367">来源：用户圈定的高德卫星局部图｜红虚框保持用户所指三处相对位置｜非完整场景范围</text>
</svg>
