<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="920" viewBox="0 0 1060 920" role="img" aria-labelledby="title desc">
  <title id="title">和家村完整视野区域草图与三处湖泊</title>
  <desc id="desc">完整选定范围约 590 乘 740 米。以清晰高德卫星图和地图坐标将用户确认的三处湖泊放在北缘、西侧中部和最西侧边缘。湖形只是示意，岸线未测；田地、植被分区边界仍是粗略假设。左下仅称植被区，坡度未确认。建筑不作为分区依据。</desc>
  <defs>
    <clipPath id="area"><rect x="0" y="0" width="552" height="696"/></clipPath>
    <pattern id="terraces" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 16 Q11 4 22 16" fill="none" stroke="#806f4d" stroke-opacity=".32" stroke-width="1.5"/></pattern>
    <pattern id="unknown" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 14 L14 0" fill="none" stroke="#5d5c53" stroke-opacity=".35" stroke-width="3"/></pattern>
  </defs>

  <rect width="1060" height="920" fill="#f8f7f1"/>
  <text x="90" y="52" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#27342b">和家村｜完整视野区域草图</text>
  <text x="90" y="80" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#5d6b60">三湖按清晰卫星图与地图坐标放回全图；岸线与分区边界仍为粗略示意</text>

  <rect x="90" y="105" width="552" height="696" fill="#72926c"/>
  <g clip-path="url(#area)" transform="translate(90 105)">
    <!-- A：西侧层叠田地。曲线只表示梯田纹理，不是逐级田埂。 -->
    <path d="M0 0 H220 C210 76 263 124 272 185 C286 244 256 279 240 326 C218 389 183 431 154 501 L0 481 Z" fill="#c7bb8c"/>
    <path d="M0 0 H220 C210 76 263 124 272 185 C286 244 256 279 240 326 C218 389 183 431 154 501 L0 481 Z" fill="url(#terraces)"/>
    <path d="M0 0 H220 C210 76 263 124 272 185 C286 244 256 279 240 326 C218 389 183 431 154 501" fill="none" stroke="#746c4c" stroke-width="3" stroke-dasharray="9 8"/>

    <!-- C：中央的林田交界与小块开阔地，不把它当作一种独立、均匀的地类。 -->
    <path d="M198 220 C245 203 298 220 335 257 C366 288 375 345 357 405 C333 462 295 494 249 521 C212 498 176 474 161 434 C157 382 177 340 197 291 Z" fill="#a5ac7b"/>
    <path d="M198 220 C245 203 298 220 335 257 C366 288 375 345 357 405 C333 462 295 494 249 521 C212 498 176 474 161 434 C157 382 177 340 197 291 Z" fill="none" stroke="#676e4c" stroke-width="3" stroke-dasharray="9 8"/>

    <!-- D：西南植被区；坡度、与梯田及南侧开阔地之间的过渡仍待核。 -->
    <path d="M0 425 C59 427 112 452 159 499 C186 532 203 574 198 626 L164 696 H0 Z" fill="#527a5d"/>
    <path d="M0 425 C59 427 112 452 159 499 C186 532 203 574 198 626" fill="none" stroke="#355d45" stroke-width="3" stroke-dasharray="9 8"/>

    <!-- E：南部、东南部田地与开阔地。 -->
    <path d="M250 520 C296 520 319 486 350 461 C397 435 451 445 552 424 L552 696 H164 C203 641 217 565 250 520 Z" fill="#d8c792"/>
    <path d="M250 520 C296 520 319 486 350 461 C397 435 451 445 552 424" fill="none" stroke="#8d794c" stroke-width="3" stroke-dasharray="9 8"/>
    <path d="M385 535 C422 522 459 555 476 604 M346 610 C393 582 426 611 447 670" fill="none" stroke="#9b885d" stroke-opacity=".6" stroke-width="2"/>

    <!-- R1：206 乡道；按相同中心的标准图与卫星图中的地物对齐后，描可见中心走向。 -->
    <path d="M-28 222 C-8 239 22 257 56 269 C79 275 104 304 108 342 C108 389 109 438 122 470 C138 511 176 541 188 581 C196 602 197 622 200 641" fill="none" stroke="#f6f2e2" stroke-width="10" stroke-linecap="round"/>
    <path d="M-28 222 C-8 239 22 257 56 269 C79 275 104 304 108 342 C108 389 109 438 122 470 C138 511 176 541 188 581 C196 602 197 622 200 641" fill="none" stroke="#806f53" stroke-width="3" stroke-linecap="round"/>
    <!-- R2：东南连接路从截图下缘附近进入，沿南部田地北缘弯向东侧；不在无遮挡区强行接到 R1。 -->
    <path d="M256 642 C266 615 303 595 331 578 C350 556 352 531 370 526 C396 525 421 557 458 568 C479 570 491 538 505 502 C515 478 532 477 562 487" fill="none" stroke="#fbf6e6" stroke-width="8" stroke-linecap="round"/>
    <path d="M256 642 C266 615 303 595 331 578 C350 556 352 531 370 526 C396 525 421 557 458 568 C479 570 491 538 505 502 C515 478 532 477 562 487" fill="none" stroke="#806f53" stroke-width="2.5" stroke-linecap="round"/>

    <!-- F：用户确认左上亮白长条是水坝兼水泥路；只按截图位置示意，不推定坝外水面边界。 -->
    <path d="M142 60 C138 80 137 108 135 140" fill="none" stroke="#5b6661" stroke-width="13" stroke-linecap="round"/>
    <path d="M142 60 C138 80 137 108 135 140" fill="none" stroke="#ede9d8" stroke-width="8" stroke-linecap="round"/>

    <!-- W1/W2 为地图右击分享坐标锚点；W3 按清晰同视野中湖间像素距离外推。湖形与大小仅用于草图识别。 -->
    <path d="M218 -25 C248 -32 269 -26 283 -32 C317 -39 353 -24 382 -14 C392 3 377 21 364 40 C345 55 318 62 291 51 C271 41 247 33 222 34 C212 18 210 -7 218 -25 Z" fill="#184759" stroke="#c8e4e4" stroke-width="2.5"/>
    <path d="M127 247 C145 246 158 260 175 276 C191 291 196 308 179 327 C156 327 140 314 130 293 C121 274 118 260 127 247 Z" fill="#184759" stroke="#c8e4e4" stroke-width="2.5"/>
    <path d="M-7 275 C6 269 31 269 49 278 C53 289 37 296 18 297 C0 297 -9 290 -7 275 Z" fill="#184759" stroke="#c8e4e4" stroke-width="2.5"/>

    <!-- 保存截图在左上和底部被网页控件遮挡，不把其下内容当成已确认地物。 -->
    <path d="M0 0 H126 V62 H0 Z M0 640 H552 V696 H0 Z" fill="url(#unknown)"/>
  </g>

  <rect x="90" y="105" width="552" height="696" fill="none" stroke="#263a2d" stroke-width="3"/>
  <circle cx="366" cy="453" r="9" fill="#f9f9f2" stroke="#27342b" stroke-width="3"/>
  <path d="M352 453 H380 M366 439 V467" stroke="#27342b" stroke-width="2"/>
  <text x="390" y="445" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#26352a">视野中心约</text>

  <g font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    <text x="200" y="370" fill="#3f392a">A 梯田</text>
    <text x="531" y="230" fill="#f8fbf3">B 林地</text>
    <text x="369" y="535" fill="#354332">C 林田交界</text>
    <text x="161" y="697" fill="#f8fbf3">D 植被</text>
    <text x="549" y="741" fill="#4b422c">E 田地</text>
  </g>
  <g font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="392" y="136">W1</text>
    <text x="242" y="395">W2</text>
    <text x="113" y="393">W3</text>
  </g>
  <path d="M230 194 L237 192 L228 173" fill="none" stroke="#253b3d" stroke-width="2"/>
  <text x="245" y="199" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#253b3d">F 水坝／水泥路</text>
  <text x="366" y="830" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#26352a">东西约 590 米</text>
  <text x="62" y="453" text-anchor="middle" transform="rotate(-90 62 453)" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#26352a">南北约 740 米</text>
  <path d="M621 96 V65 M621 65 L614 78 M621 65 L628 78" fill="none" stroke="#26352a" stroke-width="3"/>
  <text x="621" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#26352a">N</text>

  <text x="694" y="146" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#26352a">读图</text>
  <text x="694" y="190" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#334537">A 西侧：层叠田地 / 梯田</text>
  <text x="694" y="222" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#334537">B 右上：连续林地</text>
  <text x="694" y="254" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#334537">C 中央：林田交界 / 小块开阔地</text>
  <text x="694" y="286" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#334537">D 左下：植被区，坡度待核</text>
  <text x="694" y="318" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#334537">E 下方：田地与开阔地</text>
  <path d="M696 360 H748" stroke="#806f53" stroke-width="4"/>
  <text x="764" y="366" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334537">西侧 206 乡道走廊</text>
  <path d="M696 396 H748" stroke="#806f53" stroke-width="4"/>
  <text x="764" y="402" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334537">东南连接路，可见走向已核对</text>
  <path d="M696 430 H748" stroke="#5b6661" stroke-width="10"/>
  <path d="M696 430 H748" stroke="#ede9d8" stroke-width="6"/>
  <text x="764" y="436" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334537">F 左上水坝兼水泥路（用户确认）</text>
  <path d="M696 468 H748" stroke="#184759" stroke-width="12"/>
  <text x="764" y="474" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334537">W1 北缘 / W2 西中 / W3 西缘：三湖</text>
  <text x="694" y="520" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#26352a">尚未确认</text>
  <text x="694" y="554" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#6e553c">湖泊岸线与分区边界未测。</text>
  <text x="694" y="584" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#6e553c">底部遮挡处不画道路交会点。</text>
  <text x="694" y="614" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#6e553c">W3 中心按湖间距离估算。</text>
  <text x="694" y="658" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334537">湖位依据：用户清晰卫星图、</text>
  <text x="694" y="686" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#334537">高德 W1 / W2 两处点位分享。</text>
  <text x="694" y="717" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#6e553c">仅用于区域讨论；不直接落 Unity。</text>
  <text x="90" y="887" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#67756a">2026-09-27｜约 590 × 740 米的完整范围；地图坐标粗换算，仅供分区确认，不是测绘图。</text>
</svg>
